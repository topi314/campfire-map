[log]
level = "info"
format = "text"
add_source = false

[server]
addr = ":8080"
# Comma-separated browser origins allowed for CORS. Same-origin embeds need no extra entries.
# Loopback (localhost / 127.0.0.1) is always allowed for local Nuxt dev.
cors_origins = "http://localhost:3000,http://127.0.0.1:3000"

[campfire]
url = "https://niantic-social-api.nianticlabs.com/graphql"
max_retries = 3
reality_channel_id = "da83476a-c4da-4312-a610-a4f2fc2c37f0"
s2_cell_level = 15

[cache]
ttl = "24h"

[limits]
max_cells = 192
max_bbox_span = 0.35
max_export_pois = 8000

[basemaps]
# Free key from https://carto.com/basemaps/apikey — without it CARTO tiles are watermarked.
carto_api_key = ""
